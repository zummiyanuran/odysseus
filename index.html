<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Kamera HP</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #121212; color: white; }
        video { width: 100%; max-width: 400px; border-radius: 8px; margin-top: 10px; }
        input, button { padding: 12px; margin: 10px; border-radius: 5px; font-size: 15px; }
        input { width: 85%; max-width: 350px; background: #222; color: white; border: 1px solid #444; }
        button { background: #00e676; border: none; font-weight: bold; cursor: pointer; color: black; }
    </style>
</head>
<body>
    <h2>📱 Streamer Kamera HP</h2>
    <input type="text" id="server-url" placeholder="Paste URL dari Colab di sini">
    <br>
    <button onclick="startStreaming()">Mulai Kamera</button>
    <br>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('canvas');

        async function startStreaming() {
            const url = document.getElementById('server-url').value.trim();
            if(!url) { alert("Masukkan URL dari Colab terlebih dahulu!"); return; }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                video.srcObject = stream;

                // Kirim gambar dari HP ke Colab 5 kali per detik
                setInterval(() => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob(blob => {
                        let formData = new FormData();
                        formData.append('image', blob, 'frame.jpg');

                        fetch(url, { method: 'POST', body: formData })
                        .catch(err => console.log("Gagal kirim frame:", err));
                    }, 'image/jpeg', 0.5);
                }, 200);

            } catch(err) {
                alert("Gagal mengaktifkan kamera: " + err.message);
            }
        }
    </script>
</body>
</html>
