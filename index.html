<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Suara HP</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #121212; color: white; }
        input, button { padding: 12px; margin: 10px; border-radius: 5px; font-size: 15px; }
        input { width: 85%; max-width: 350px; background: #222; color: white; border: 1px solid #444; }
        button { background: #ff3d00; border: none; font-weight: bold; cursor: pointer; color: white; }
        #status { margin-top: 15px; font-weight: bold; color: #00e676; }
    </style>
</head>
<body>
    <h2>🎙️ Streamer Mikrofon HP</h2>
    <input type="text" id="server-url" placeholder="Paste URL Serveo di sini">
    <br>
    <button onclick="startStreaming()">Mulai Kirim Suara</button>
    <div id="status"></div>

    <script>
        async function startStreaming() {
            const url = document.getElementById('server-url').value.trim();
            if(!url) { alert("Masukkan URL Serveo terlebih dahulu!"); return; }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('status').innerText = "🎙️ Mikrofon Aktif... Silakan Bicaralah!";

                // Mengirim rekaman suara setiap 3 detik
                setInterval(() => {
                    let mediaRecorder = new MediaRecorder(stream);
                    let chunks = [];

                    mediaRecorder.ondataavailable = e => chunks.push(e.data);
                    
                    mediaRecorder.onstop = () => {
                        let blob = new Blob(chunks, { type: 'audio/webm' });
                        let formData = new FormData();
                        formData.append('audio', blob, 'sound.webm');

                        fetch(url, { method: 'POST', body: formData })
                        .then(res => console.log("Audio berhasil dikirim"))
                        .catch(err => console.log("Gagal kirim audio:", err));
                    };

                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 3000); // Merekam durasi 3 detik
                }, 3500);

            } catch(err) {
                alert("Gagal akses mikrofon: " + err.message);
            }
        }
    </script>
</body>
</html>
