<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Mikrofon HP</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #121212; color: white; }
        input, button { padding: 12px; margin: 10px; border-radius: 5px; font-size: 15px; }
        input { width: 85%; max-width: 350px; background: #222; color: white; border: 1px solid #444; }
        button { background: #ff3d00; border: none; font-weight: bold; cursor: pointer; color: white; }
        #status { margin-top: 15px; font-weight: bold; color: #00e676; }
    </style>
</head>
<body>
    <h2>🎙️ Streamer Mikrofon HP</h2>
    <input type="text" id="server-url" placeholder="Paste URL dari Colab di sini">
    <br>
    <button onclick="startAudioStreaming()">Mulai Rekam & Kirim Suara</button>
    <div id="status"></div>

    <script>
        let mediaRecorder;

        async function startAudioStreaming() {
            const baseUrl = document.getElementById('server-url').value.trim();
            if(!baseUrl) { alert("Masukkan URL dari Colab terlebih dahulu!"); return; }
            
            // Format URL penerima audio
            const targetUrl = baseUrl.endsWith('/') ? baseUrl + 'upload-audio' : baseUrl + '/upload-audio';

            try {
                // Minta izin akses mikrofon
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                document.getElementById('status').innerText = "🎙️ Mikrofon Aktif & Mengirim Suara...";

                // Kirim potongan audio setiap 2 detik
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = async (event) => {
                    if (event.data.size > 0) {
                        let formData = new FormData();
                        formData.append('audio', event.data, 'audio.webm');

                        fetch(targetUrl, { method: 'POST', body: formData })
                        .catch(err => console.log("Gagal kirim audio:", err));
                    }
                };

                // Ambil & kirim sampel suara tiap 2000 ms (2 detik)
                mediaRecorder.start(2000);

            } catch(err) {
                alert("Gagal mengakses mikrofon: " + err.message);
            }
        }
    </script>
</body>
</html>
