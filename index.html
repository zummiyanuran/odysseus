<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Suara HP</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #121212; color: white; }
        input, button { padding: 12px; margin: 10px; border-radius: 5px; font-size: 15px; }
        input { width: 85%; max-width: 350px; background: #222; color: white; border: 1px solid #444; }
        button { background: #ff3d00; border: none; font-weight: bold; cursor: pointer; color: white; }
        #status { margin-top: 15px; font-weight: bold; color: #00e676; }
    </style>
</head>
<body>
    <h2>🎙️ Streamer Mikrofon HP (WAV)</h2>
    <input type="text" id="server-url" placeholder="Paste URL Serveo di sini">
    <br>
    <button onclick="startRecording()">Mulai Kirim Suara</button>
    <div id="status"></div>

    <script>
        let audioContext;
        let recorder;

        async function startRecording() {
            const url = document.getElementById('server-url').value.trim();
            if(!url) { alert("Masukkan URL dari Colab!"); return; }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('status').innerText = "🎙️ Mikrofon Aktif... Bicaralah!";

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const input = audioContext.createMediaStreamSource(stream);
                
                // Merekam dalam potongan 3 detik menggunakan Web Audio API
                setInterval(async () => {
                    const recorder = new MediaRecorder(stream);
                    let chunks = [];

                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/wav' });
                        let formData = new FormData();
                        formData.append('audio', blob, 'sound.wav');

                        fetch(url, { method: 'POST', body: formData })
                        .then(res => console.log("Audio terkirim"))
                        .catch(err => console.log("Gagal kirim:", err));
                    };

                    recorder.start();
                    setTimeout(() => recorder.stop(), 2500); // Rekam per 2.5 detik
                }, 3000);

            } catch(err) {
                alert("Gagal akses mikrofon: " + err.message);
            }
        }
    </script>
</body>
</html>
