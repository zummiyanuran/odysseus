<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC HP Camera Streamer</title>
    <!-- Library PeerJS untuk kemudahan koneksi WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #121212; color: white; }
        video { width: 100%; max-width: 400px; border-radius: 8px; margin-top: 10px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; max-width: 400px; margin: 0 auto; }
        #peer-id { font-weight: bold; color: #00e676; word-break: break-all; }
        button { padding: 10px 20px; background: #29b6f6; border: none; border-radius: 5px; color: white; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📱 Streamer Kamera HP</h2>
        <p>ID Peer Anda (Masukan ke Python):</p>
        <p id="peer-id">Memuat ID...</p>
        <button onclick="startCamera()">Aktifkan Kamera</button>
        <br>
        <video id="local-video" autoplay playsinline muted></video>
    </div>

    <script>
        // Buat ID PeerJS unik secara acak
        const customId = "camera-hp-" + Math.floor(Math.random() * 10000);
        const peer = new Peer(customId);

        peer.on('open', (id) => {
            document.getElementById('peer-id').innerText = id;
        });

        async function startCamera() {
            try {
                // Minta akses kamera belakang HP jika ada
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                document.getElementById('local-video').srcObject = stream;

                // Terima panggilan masuk dari Script Python Colab
                peer.on('call', (call) => {
                    call.answer(stream);
                    console.log("Koneksi tersambung dengan Python!");
                });
            } catch (err) {
                alert("Gagal mengakses kamera: " + err.message);
            }
        }
    </script>
</body>
</html>
